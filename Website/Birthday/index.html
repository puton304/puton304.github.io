<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <title>🎂 生日抽獎</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1 class="title">🎂 生日抽獎</h1>

        <div class="folders-container">
            <button class="folder" onclick="drawPrize(1)">
                <img src="01.jpg" alt="資料夾 A"><br>小櫻祝你生日快樂
            </button>
            <button class="folder" onclick="drawPrize(2)">
                <img src="02.jpg" alt="資料夾 B"><br>這是你的禮物
            </button>
            <button class="folder" onclick="drawPrize(3)">
                <img src="03.jpg" alt="資料夾 C"><br>選我就對了
            </button>
            <button class="folder" onclick="drawPrize(4)">
                <img src="04.jpg" alt="資料夾 D"><br>好東西不拿真可惜
            </button>
        </div>

        <div id="result" class="result"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
