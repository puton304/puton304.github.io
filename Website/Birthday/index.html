<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 生日抽獎</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1 class="title">🎂 生日抽獎</h1>
        <button class="debug-btn" onclick="toggleDebug()">神奇按鈕</button>
        <p class="subtitle">選擇一個資料夾，看看你的生日驚喜！</p>

        <div id="debugInfo" class="debug-info">
            <strong>🔍 當前禮物：</strong><br>
            <span id="debugContent"></span>
        </div>

        <div class="folders-container">
            <button class="folder" onclick="drawPrize(1)">
                <span class="folder-icon">📁</span>
                資料夾 1
            </button>
            <button class="folder" onclick="drawPrize(2)">
                <span class="folder-icon">📁</span>
                資料夾 2
            </button>
            <button class="folder" onclick="drawPrize(3)">
                <span class="folder-icon">📁</span>
                資料夾 3
            </button>
        </div>

        <div id="result" class="result"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
